<style>
:root{--char:#1A1917;--gold:#B29860;--gold-light:#DCC894;--cream:#F9F4EC;--wa:#1FA855;--wa-dark:#178A45;--fd:"Cormorant Garamond",Georgia,serif;--fb:"Nunito Sans","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);background:var(--char);color:#fff;display:grid;place-items:center;padding:24px;text-align:center;overflow:hidden;position:relative}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 30%,rgba(178,152,96,.18),transparent 60%);pointer-events:none}
.arc{position:absolute;right:0;top:0;width:min(50vw,560px);opacity:.9;pointer-events:none}
.box{position:relative;max-width:560px;width:100%}
.logo{height:52px;width:auto;margin:0 auto 40px}
.ring{width:84px;height:84px;border-radius:50%;border:1px solid rgba(220,200,148,.5);display:grid;place-items:center;margin:0 auto 28px;position:relative}
.ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(220,200,148,.25);border-top-color:var(--gold-light);animation:spin 1.6s linear infinite}
.ring svg{width:34px;height:34px;color:var(--gold-light)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:var(--fd);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(30px,5vw,44px);line-height:1.05}
h1 span{color:var(--gold-light)}
p{color:rgba(255,255,255,.72);margin:18px auto 0;max-width:40ch;font-size:17px;line-height:1.6}
.count{display:inline-block;margin-top:14px;font-size:14px;color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:11px;margin-top:32px;padding:18px 30px;border-radius:8px;font-weight:700;font-size:16px;color:#fff;text-decoration:none;background:linear-gradient(180deg,#25B862,var(--wa));box-shadow:0 12px 30px -10px rgba(31,168,85,.75);transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-2px);background:linear-gradient(180deg,#22AD5B,var(--wa-dark))}
.btn svg{width:22px;height:22px}
.foot{margin-top:40px;font-size:12px;color:rgba(255,255,255,.4)}
.foot a{color:rgba(255,255,255,.55)}
@media (prefers-reduced-motion:reduce){.ring::before{animation:none}}
</style>
